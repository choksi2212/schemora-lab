name: Verify development
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: schemora
          POSTGRES_USER: schemora
          POSTGRES_PASSWORD: schemora_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schemora -d schemora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://schemora:schemora_ci@127.0.0.1:5432/schemora
      TEST_DATABASE_URL: postgres://schemora:schemora_ci@127.0.0.1:5432/schemora_test
      SESSION_SECRET: ci-api-secret-for-tests-only-at-least-32-characters
      AUTH_SECRET: ci-auth-secret-for-tests-only-at-least-32-characters
      API_PORT: '4001'
      API_HOST: 127.0.0.1
      API_ORIGIN: http://127.0.0.1:4001
      WEB_ORIGIN: http://localhost:3010
      DEV_AUTH: 'true'
      STORAGE_DRIVER: filesystem
      STORAGE_DIRECTORY: ${{ github.workspace }}/.schemora/objects
      EXTRACTION_MODE: rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker build --file Dockerfile.web --tag schemora-web:ci .
      - run: docker build --file Dockerfile.api --tag schemora-api:ci .
      - run: docker build --file Dockerfile.worker --tag schemora-worker:ci .
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
