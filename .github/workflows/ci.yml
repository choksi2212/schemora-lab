name: Verify development
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: schemora
          POSTGRES_USER: schemora
          POSTGRES_PASSWORD: schemora_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schemora -d schemora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://schemora:schemora_ci@127.0.0.1:5432/schemora
      TEST_DATABASE_URL: postgres://schemora:schemora_ci@127.0.0.1:5432/schemora_test
      SESSION_SECRET: ci-api-secret-for-tests-only-at-least-32-characters
      AUTH_SECRET: ci-auth-secret-for-tests-only-at-least-32-characters
      API_PORT: '4001'
      API_HOST: 127.0.0.1
      API_ORIGIN: http://127.0.0.1:4001
      WEB_ORIGIN: http://localhost:3010
      DEV_AUTH: 'true'
      STORAGE_DRIVER: filesystem
      STORAGE_DIRECTORY: ${{ github.workspace }}/.schemora/objects
      EXTRACTION_MODE: rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
