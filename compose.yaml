services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: schemora
      POSTGRES_USER: schemora
      POSTGRES_PASSWORD: schemora_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemora -d schemora"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
